name: openGym
version: "0.1.0"
slug: opengym
description: Self-hosted gym and body-weight tracker (opengym.ch)
url: https://opengym.ch
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Direct port: passkeys bind to a hostname, so ingress is not used.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: openGym web UI
# /data is persisted and included in Home Assistant backups.
map: []
options:
  rp_id: localhost
  origin: http://localhost:8080
  first_user_admin: true
  invite_only: false
  allow_guest: true
  coach_disabled: true
  default_lang: en
schema:
  rp_id: str
  origin: str
  first_user_admin: bool
  invite_only: bool
  allow_guest: bool
  coach_disabled: bool
  default_lang: str
